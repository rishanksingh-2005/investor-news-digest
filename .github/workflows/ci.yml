name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Cancel an in-progress run when new commits land on the same branch / PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install "ruff>=0.6"
      - run: ruff check .

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.13", "3.14"]
        include:
          - os: windows-latest     # the project is mostly run on Windows
            python: "3.14"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests (offline — no Chrome, LLM or network needed)
        run: python -m pytest

      - name: Accuracy scores on the labelled cases
        run: python eval/evaluate.py --quiet

      - name: CLI smoke check (source checkout)
        run: python "news digest.py" --help

      - name: Install as a package and run the newsdigest command
        shell: bash
        run: |
          python -m pip install .
          cd "$RUNNER_TEMP"
          newsdigest --help
          newsdigest --init-watchlist watchlist.csv
          newsdigest --init-config config.yaml
          newsdigest --check
